name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Validation reads local files only. It needs no login.
      - run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

  frontmatter:
    name: Skill frontmatter
    runs-on: ubuntu-latest
    env:
      # The yaml version pi 1.4.0 parses SKILL.md with.
      YAML_VERSION: 2.9.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # plugin validate passes frontmatter that is not valid YAML, so this parses it.
      - name: Every SKILL.md frontmatter parses, with a name and a description of at most 1024 characters
        run: node reviews/all-skills/checks/check-frontmatter.mjs

  webgpu:
    name: WebGPU checks
    runs-on: ubuntu-latest
    env:
      NAGA_VERSION: 30.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Layout script matches the WGSL spec examples
        run: node reviews/webgpu/checks/layout-selftest.mjs
      # naga takes a few minutes to build, so keep the binary between runs.
      - uses: actions/cache@v6
        id: naga
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ env.NAGA_VERSION }}-${{ runner.os }}
      - if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version ${{ env.NAGA_VERSION }} --locked
      - name: Every WGSL snippet in the docs compiles
        run: node reviews/webgpu/checks/check-wgsl-snippets.mjs

  code-readability:
    name: Code readability checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Magic-number FAIL/PASS cases and skill links
        run: node reviews/code-readability/checks/check-magic-numbers.mjs

  typescript-safety:
    name: TypeScript samples
    runs-on: ubuntu-latest
    env:
      TS_VERSIONS: 7.0.2 6.0.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every TypeScript sample in the skill type-checks
        run: node reviews/typescript-safety/checks/check-ts-snippets.mjs
      - name: Every TypeScript sample in gotchas type-checks
        run: node reviews/gotchas/checks/check-ts-snippets.mjs

  ascii-art:
    name: ASCII art checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Drawings line up, samples match the scripts, counts match
        run: node reviews/ascii-art/checks/check-skill.mjs

  react-testing:
    name: React testing examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 bundles npm 10, whose peer resolver crashes on this stack ("Cannot read
      # properties of null (reading 'edgesOut')"). Node 26 bundles npm 11, and the skill's
      # probes ran on Node 26 (skills/react-testing/SOURCES.md).
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Every tsx test example passes on the pinned stack, links resolve, counts match
        run: node reviews/react-testing/checks/check-skill.mjs

  tailwind-design-system:
    name: Tailwind design system checks
    runs-on: ubuntu-latest
    env:
      TW_VERSION: 4.3.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: CSS samples compile, sample classes exist, theme passes contrast, scripts match fixtures
        run: node reviews/tailwind-design-system/checks/check-skill.mjs

  media-prompt:
    name: Media prompt checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspector names each fixture model, doc numbers follow the model rules, links and counts match
        run: node reviews/media-prompt/checks/check-skill.mjs

  media-plan:
    name: Media plan checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Worked example fits the models, no em dashes, links and counts match
        run: node reviews/media-plan/checks/check-skill.mjs
